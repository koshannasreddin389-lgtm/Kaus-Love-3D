<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10091f">
<title>Моя Вселенная ♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(ellipse at 15% 20%, #51316f, transparent 50%),
        radial-gradient(ellipse at 85% 80%, #572b68, transparent 45%),
        linear-gradient(135deg, #090817, #211334, #100b20);
    color: white;
}

#stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.star {
    position: absolute;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 9px #e5c5ff;
    animation: twinkle ease-in-out infinite;
}

@keyframes twinkle {
    0%, 100% {
        opacity: .15;
        transform: scale(.7);
    }
    50% {
        opacity: 1;
        transform: scale(1.6);
    }
}

.main-card {
    position: relative;
    z-index: 2;
    width: min(90%, 470px);
    padding: 55px 35px 40px;
    text-align: center;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 30px;
    background: rgba(255,255,255,.065);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    box-shadow:
        0 20px 80px rgba(0,0,0,.3),
        0 0 50px rgba(185,115,255,.12);
    animation: appear 1.5s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(30px) scale(.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.heart {
    color: #f3c0ed;
    font-size: 39px;
    margin-bottom: 14px;
    text-shadow: 0 0 25px #ec8fe8;
    animation: heartbeat 2.5s infinite;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
}

.logo {
    font-family: 'Great Vibes', cursive;
    font-size: 57px;
    font-weight: normal;
    color: #f8dafa;
    text-shadow: 0 0 25px rgba(235,174,255,.3);
}

.subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-style: italic;
    letter-spacing: 2px;
    color: #c8b3db;
    margin-top: 5px;
}

.divider {
    width: 65px;
    height: 1px;
    margin: 35px auto;
    background: linear-gradient(90deg, transparent, #e9b6ed, transparent);
}

.question {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(34px, 8vw, 45px);
    color: #fff0ff;
    margin-bottom: 28px;
    line-height: 1.3;
}

.input-box {
    width: 100%;
    height: 60px;
    padding: 10px 18px;
    border: 1px solid rgba(231,186,255,.4);
    border-radius: 15px;
    outline: none;
    background: rgba(255,255,255,.06);
    color: #fff0ff;
    text-align: center;
    font-family: 'Great Vibes', cursive;
    font-size: 31px;
    transition: .4s;
}

.input-box::placeholder {
    color: rgba(230,203,239,.55);
}

.input-box:focus {
    border-color: #efb6ed;
    background: rgba(255,255,255,.10);
    box-shadow: 0 0 25px rgba(217,142,255,.18);
}

.continue {
    width: 100%;
    height: 57px;
    margin-top: 22px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 15px;
    background: linear-gradient(110deg, #d3a0e7, #f0b9dc);
    color: #281532;
    font-family: 'Cormorant Garamond', serif;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .35s;
}

.continue:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(221,155,240,.3);
}

.continue:active {
    transform: scale(.97);
}

.footer {
    margin-top: 32px;
    font-family: 'Great Vibes', cursive;
    font-size: 25px;
    color: #cbb0df;
}

#error {
    margin-top: 12px;
    font-family: 'Cormorant Garamond', serif;
    color: #ffd2ec;
    font-size: 17px;
    min-height: 20px;
}

@media(max-width:480px) {
    .main-card {
        padding: 45px 23px 32px;
    }

    .logo {
        font-size: 49px;
    }

    .question {
        font-size: 36px;
    }
}
</style>
</head>

<body>

<div id="stars"></div>

<main class="main-card">

    <div class="heart">♡</div>

    <h1 class="logo">Моя Вселенная</h1>

    <p class="subtitle">
        маленький мир, созданный для тебя
    </p>

    <div class="divider"></div>

    <h2 class="question">
        Как ты хочешь меня называть?
    </h2>

    <input
        type="text"
        class="input-box"
        id="nickname"
        placeholder="Напиши здесь..."
        autocomplete="off"
        maxlength="30"
    >

    <button class="continue" onclick="continuePage()">
        Продолжить ♡
    </button>

    <p id="error"></p>

    <div class="footer">
        создано с любовью
    </div>

</main>

<script>
const stars = document.getElementById("stars");

for (let i = 0; i < 220; i++) {
    const star = document.createElement("span");
    star.className = "star";

    const size = Math.random() * 2.2 + 0.6;

    star.style.width = size + "px";
    star.style.height = size + "px";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDuration = (2 + Math.random() * 4) + "s";
    star.style.animationDelay = Math.random() * 5 + "s";

    stars.appendChild(star);
}

function continuePage() {
    const nickname = document.getElementById("nickname").value.trim();
    const error = document.getElementById("error");

    if (!nickname) {
        error.textContent = "Пожалуйста, напиши, как хочешь меня называть ♡";
        return;
    }

    error.textContent = "";

    alert("Очень приятно, " + nickname + " ♡");
}

document.getElementById("nickname").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        continuePage();
    }
});
</script>

</body>
</html>
